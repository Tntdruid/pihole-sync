name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.8", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python tests/test_pihole_sync.py -v
      - run: python tests/test_kea_to_pihole.py -v
      - run: shellcheck kea-to-pihole/kea-to-pihole.sh
